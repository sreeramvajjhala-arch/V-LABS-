name: V Labs CI & Automation Quality Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Run Quality Gates & Automated TDD Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Secret Boundary Hygiene
        run: |
          echo "Scanning for accidental hardcoded secrets..."
          ! git grep -i "AIzaSy" app.js || (echo "CRITICAL: Gemini key leak detected" && exit 1)

      - name: Execute Automated TDD Test Suite
        run: node tests/suite.js
